spring:
  application:
    name: clinic-backend

  datasource:
    url: jdbc:h2:mem:clinic_db
    driver-class-name: org.h2.Driver
    username: sa
    password:
    h2:
      console:
        enabled: true
        path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

server:
  port: 8080

jwt:
  secret: clinic-management-system-secret-key-for-jwt-signing-must-be-at-least-256-bits
  expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
